# water-scada-lite demo configuration. Thresholds are generic defaults, not tuned per station.
[qa]
latency_min = 30        # portal publishes with a delay; samples newer than (fetch time - latency) are not "expected"
stuck_samples = 24      # flat for >= 2 h at 5 min sampling
spike_k = 8.0

[alarms]
rise_pct_per_h = 25.0   # rate-of-rise alarm on discharge (percent per hour, 60 min window)
rise_window_min = 60
elevated_factor = 3.0   # discharge >= factor x baseline median
baseline_hours = 48     # baseline = median of the first N clean hours of the snapshot
hysteresis = 0.05       # clear at 95 % of a high threshold
min_samples = 2         # debounce

[forecast]
horizons_min = [60, 180]
train_frac = 0.6

# 10 FOEN/BAFU stations (ids as on hydrodaten.admin.ch).
[[stations]]
